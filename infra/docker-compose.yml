# Local development stack. `make dev` starts the infra services and runs apps on the host;
# `make up-full` also runs the api/worker/web containers (profile "app").
name: thiqa

x-app-env: &app-env
  APP_ENV: local
  DATABASE_URL: postgresql+asyncpg://thiqa:thiqa@postgres:5432/thiqa
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin
  S3_BUCKET_MEDIA: thiqa-media

services:
  postgres:
    build: ./docker/postgres
    image: thiqa/postgres:16
    environment:
      POSTGRES_USER: thiqa
      POSTGRES_PASSWORD: thiqa
      POSTGRES_DB: thiqa
    ports: ['${POSTGRES_PORT:-5432}:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/20-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U thiqa -d thiqa']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['${REDIS_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['${MINIO_PORT:-9000}:9000', '${MINIO_CONSOLE_PORT:-9001}:9001']
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/thiqa-media"
    restart: 'no'

  mailpit:
    image: axllent/mailpit:latest
    ports: ['${MAILPIT_SMTP_PORT:-1025}:1025', '${MAILPIT_UI_PORT:-8025}:8025']

  api:
    profiles: [app]
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    environment: *app-env
    ports: ['8000:8000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    profiles: [app]
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    command: ['arq', 'worker.main.WorkerSettings']
    environment: *app-env
    depends_on:
      redis: { condition: service_healthy }

  web:
    profiles: [app]
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ['3000:3000']
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
